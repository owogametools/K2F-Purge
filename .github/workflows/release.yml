# Tag-driven desktop release for THIS repository.
#
# This repo intentionally ships source — it is security software.
# Assets are published here with GITHUB_TOKEN only (Release author =
# github-actions[bot]). No cross-repo handoff, no PAT, and no artifact
# upload/download actions: each matrix job builds and uploads its own assets
# directly to the GitHub Release. Windows publishes two independent assets
# (portable zip + NSIS setup) so the 37 MiB model is not downloaded twice.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Keyed on the tag so a re-push of the same tag queues instead of
# interleaving uploads. Do not cancel: a half-finished Release is worse.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            target: windows-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: linux-amd64
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            target: darwin-arm64
            archive: tar.gz
          # Cross-compile on the arm64 macOS runner: this app has no cgo.
          - os: macos-latest
            goos: darwin
            goarch: amd64
            target: darwin-amd64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Test
        run: go test ./...

      # The 37 MiB model is fetched at build time, verified by size + sha256,
      # and then copied next to the exe and into the NSIS installer by mygo.
      - name: Fetch AstrLink model (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/fetch-astrlink.ps1

      - name: Fetch AstrLink model (Unix)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/fetch-astrlink.sh

      - name: Build (Windows, mygo)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go tool mygo build -platform windows/amd64
          $dir = 'build/windows-amd64'
          if (-not (Test-Path -LiteralPath $dir)) {
            throw "mygo did not write $dir"
          }
          # mygo names the portable exe after mygo.json's "name".
          $exe = Join-Path $dir 'K2F PURGE.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "missing $exe"
          }
          $setup = @(Get-ChildItem -LiteralPath $dir -Filter 'k2f-purge-setup-*-amd64.exe' -File)
          if ($setup.Count -lt 1) {
            throw "missing installer k2f-purge-setup-<version>-amd64.exe in $dir"
          }
          # The portable archive ships this directory; fail here rather than
          # publishing an archive the app cannot run inference from.
          $model = Join-Path $dir 'astrlink-guard'
          if (-not (Test-Path -LiteralPath $model -PathType Container)) {
            throw "missing model directory $model"
          }
          Get-ChildItem -LiteralPath $dir | Format-Table Name, Length

      - name: Build (Unix)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # main.go declares `var version`, stamped with -X so the binary
          # reports the tag it was built from.
          version="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags "-s -w -X main.version=${version}" -o k2f-purge .
          test -f k2f-purge

      - name: Package Windows assets
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'build/windows-amd64'
          $dist = 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Portable asset: the exe, the verified astrlink-guard/ directory the
          # app looks for at <exe dir>/astrlink-guard/<rev12>/, and the
          # third-party notices required for redistributing the model. The
          # NSIS installer is excluded on purpose: it embeds its own copy of
          # the model, so including it here would ship the model twice.
          $stage = Join-Path $dist 'portable'
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath (Join-Path $dir 'K2F PURGE.exe') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $dir 'astrlink-guard') -Destination $stage -Recurse
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination $stage

          $zip = Join-Path $dist 'k2f-purge-${{ matrix.target }}-portable.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Remove-Item -LiteralPath $stage -Recurse -Force

          # Setup asset: mygo names the installer after the build version;
          # publish it under a stable name.
          $setup = @(Get-ChildItem -LiteralPath $dir -Filter 'k2f-purge-setup-*-amd64.exe' -File)
          if ($setup.Count -ne 1) {
            throw "expected one installer in $dir, found $($setup.Count)"
          }
          $setupAsset = Join-Path $dist 'k2f-purge-${{ matrix.target }}-setup.exe'
          Copy-Item -LiteralPath $setup[0].FullName -Destination $setupAsset -Force

          Get-Item -LiteralPath $zip, $setupAsset | Format-Table Name, Length

      - name: Package Unix tarball
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Ship the verified model directory next to the binary, matching the
          # runtime lookup at <exe dir>/astrlink-guard/<rev12>/.
          # COPYFILE_DISABLE keeps macOS tar from injecting AppleDouble ._* files.
          COPYFILE_DISABLE=1 tar -czf "dist/k2f-purge-${{ matrix.target }}.tar.gz" \
            -C "$PWD" k2f-purge THIRD_PARTY_NOTICES.md \
            -C "$PWD/resources" astrlink-guard
          ls -la "dist/k2f-purge-${{ matrix.target }}.tar.gz"

      # One Release, many jobs: every matrix cell uploads its own asset.
      # First job to arrive creates the Release; the rest reuse it.
      # If two creates collide, the loser falls through to `gh release view`,
      # which must succeed because the winner already created it.
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              --target "${{ github.sha }}" \
              || gh release view "$TAG" >/dev/null
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GOOS" = "windows" ]; then
            # Two independent Windows distributions; each carries one copy of
            # the model instead of one archive carrying both.
            assets=(
              "dist/k2f-purge-${TARGET}-portable.zip"
              "dist/k2f-purge-${TARGET}-setup.exe"
            )
          else
            assets=("dist/k2f-purge-${TARGET}.${ARCHIVE}")
          fi
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "missing asset: $asset" >&2; exit 1; }
            gh release upload "$TAG" "$asset" --clobber
          done
          gh release view "$TAG"
